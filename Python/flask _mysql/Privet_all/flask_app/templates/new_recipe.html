<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Document</title>
</head>
<body>
    <div>
        <h1>Add aNew Recipe!</h1>
        <div>
            <a href="/recipes"> back to recipes</a>
            <a href="/logout">log-out</a>
        </div>
    </div>
    <form action="/recipes/create" method="POST">
        <label for="name">Name:</label>
        <input type="text" name="name" required><br>
        
        <label for="discription">Description:</label>
        <textarea name="discription" required></textarea><br>
        
        <label for="instructions">Instructions:</label>
        <textarea name="instructions" required></textarea><br>
        
        <label for="date_cooked"></label>
        <input type="date" name="date_cooked" required><br>

    </div>
    <label for="underminute">under 30 mn</label>
    <div class="form-check">
      <input class="form-check-input" type="radio" name="underminute" value="1">
      <label class="form-check-label" for="underminute">
        yes
      </label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="radio" value="0" name="underminute"  checked>
      <label class="form-check-label" for="underminute">
        no
      </label>
    </div>

        

        
        

        <button type="submit">Create Recipe</button>
    </form>
    
</body>
</html>
