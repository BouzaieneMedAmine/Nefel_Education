<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe List</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-text text-white ms-3">
                Welcome, <strong>{{ user.first_name }}</strong>
            </span>
            <div class="ms-auto">
                <a href="/recipes/new" class="btn btn-success me-2">New Recipe</a>
                <a href="/logout" class="btn btn-danger">Log Out</a>
            </div>
        </div>
    </nav>

    <!-- Table Section -->
    <div class="container mt-4">
        <h3 class="mb-3 text-center">All Posted Recipes</h3>
        <div class="table-responsive">
            <table class="table table-striped table-bordered text-center">
                <thead class="table-dark">
                    <tr>
                        <th>Name</th>
                        <th>Under 30 min</th>
                        <th>Posted By</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for recipe in recipes %}
                    <tr>
                        <td>{{ recipe.name }}</td>
                        <td>
                            {% if recipe.underminute == 1 %}
                                Yes
                            {% else %}
                                No
                            {% endif %}
                        </td>
                        <td>{{ recipe.postedBy }}</td>
                        <td>
                            <a href="/recipes/{{ recipe.id }}" class="btn btn-info btn-sm">View</a>
                            <a href="/recipes/edit/{{ recipe.id }}" class="btn btn-warning btn-sm">Edit</a>
                            <a href="/recipes/delete/{{ recipe.id }}" class="btn btn-danger btn-sm">Delete</a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    <!-- Bootstrap JS (Optional) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
