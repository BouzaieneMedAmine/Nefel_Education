
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <title>Document</title>
</head>
<body>
    <div>
        <h1>Welcome {{user.first_name}}</h1>
         <h4>  All Posted recipes :</h4>

    </div>
 <div style="margin-left: 1444px;">
    <a href="/new/rec">+ create </a>
    <br>
  
    <a href="/logout" >  Log out </a>

 </div>
     
    <center>

      
        <div class="container mt-4">
            <div class="d-flex justify-content-between">
             </div>
  
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>underminute</th>
                        <th>Posted By</th>
                        <!-- <th>Last_Name</th>
                        <th>email</th>
                        <th>created_at</th>
                        <th>action</th> -->
                     </tr>
                </thead>
                <tbody>

                    {% for recc in allrecipes %}
                    <tr>
                        <td>{{recc.name}}</td>
                        {% if recc.underminute == 1 %}
                        <td>YES</td>
                        {% else %}
                        <td>NO</td>
                        {% endif %}
            
 
                        <td>{{recc.first_name}}</td>
                        
                    <td> 
                        <a href="/rec/show/{{recc.idrec}}"   >Show </a>
                         {% if  user.id   == recc.id %}                      
                        <a href="/rec/edit/{{recc.idrec}}"   >Edit</a>


                        <a href="/rec/del/{{recc.idrec}}">Delete</a>
                         {% endif %}
                    </td>
                    {% endfor %}

                </tbody>
            </table>
      
  
        </div>
        
    </center>
 
</body>
</html>
