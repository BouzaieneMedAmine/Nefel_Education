<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Details</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg">
                <div class="card-header bg-primary text-white">
                    <h2 class="mb-0">  recepis</h2>
                </div>
                <div class="card-body">
               
                   <h1>     {{recone.name}}   </h1>
                   <h5  style="margin-left: 666px;"  > Psted by :  {{recone.first_name}} </h5>
                   <br>
                   <br>
                    <div class="row mb-3">
                        <div class="col-sm-4 fw-bold">discription:</div>
                        <div class="col-sm-8">{{recone.discription}}</div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-4 fw-bold">underminute:</div>
                         {% if recone.underminute == 1 %}
                         <div class="col-sm-8"> YES</div>
                         {% else %}
                        <div class="col-sm-8">NO</div>
                         {% endif %}
                     


                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-4 fw-bold">instrution:</div>
                        <div class="col-sm-8 text-success" style="color: black;"> {{recone.instrution}}</div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-4 fw-bold">Date Made :</div>
                        <div class="col-sm-8" style="color: black;" >{{recone.date_coced}} </div>
                    </div>
                </div>
                <div class="card-footer text-center">
                  
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
