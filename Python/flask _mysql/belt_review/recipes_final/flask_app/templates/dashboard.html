<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" 
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Dashboard</title>
</head>
<body>
    <div class="container mt-5">
        <h1>Welcome, {{ user.first_name }}!</h1>
        <div class="d-flex justify-content-between align-items-center mt-5">
            <h5>All Posted Recipes</h5>
            <div class="d-flex gap-2">
                <a href="/recipes/new" class="btn btn-primary">+ Create</a>
                <form action="/logout" method="post">
                    <button type="submit" class="btn btn-danger">Logout</button>
                </form>
            </div>
        </div>

        <div>
            <table class="table table-striped mt-3">
                <thead>
                    <tr>
                        <th scope="col">Name</th>
                        <th scope="col">Under 30 Min</th>
                        <th scope="col">Posted By</th>
                        <th scope="col">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for recipe in recipes %}
                    <tr>
                        <td>{{ recipe.name }}</td>
                        <td>
                            {% if recipe.under_30_min == 1 %}
                                Yes
                            {% else %}
                                No
                            {% endif %}
                        </td>
                        <td>{{ recipe.creator }}</td>
                        <td class="d-flex align-items-center justify-content-around">
                            <a href="/recipes/{{ recipe.id }}" class="btn btn-info btn-sm">View</a>

                            {% if recipe.user_id == user.id %}
                                <a href="/recipes/edit/{{ recipe.id }}" class="btn btn-warning btn-sm">Edit</a>
                                <form action="/recipes/delete/{{ recipe.id }}" method="post" 
                                      onsubmit="return confirm('Are you sure you want to delete this recipe?');" style="display:inline;">
                                    <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                                </form>
                            {% endif %}
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
