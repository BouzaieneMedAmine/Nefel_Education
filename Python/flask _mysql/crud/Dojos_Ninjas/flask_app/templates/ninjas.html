<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Ninjas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <h1>New Ninja</h1>
    <form method="post" action="/ninjas/create">
          
        <label  class="form-label">First_Name:</label>
        
        <input type="text" name="first_name">
        
        <label class="form-label">last_Name :</label>
        
        <input type="text" name="last_name">
        
        <label class="form-label"> Age :</label>
        
        <input    type="number" name="age">
        <label class="form-label">dojo :</label>
        
        <select name="dojo_id" class="form-select" >
             {% for dojo in dojo %}
             <option value="{{dojo.id}}">{{dojo.name}}</option>
             {% endfor %}
        </select> 
        
        <button type="submit" class="btn btn-primary w-111"> Add ninja</button>
    </form>

    <a href="/dojos">HOME</a>
    
</body>
</html>
