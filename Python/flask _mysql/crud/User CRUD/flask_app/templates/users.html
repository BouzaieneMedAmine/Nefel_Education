<!DOCTYPE html>
<html lang="en">
<head>

    <title>Users</title>

<body>
    <h1 class="text-center">Here are our users!!!</h1>

                <th>First Name</th>
                <th>Last Name</th>
                <th>Email</th>
                <th>Created At</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td>{{ user.first_name }}</td>
                <td>{{ user.last_name }}</td>
                <td>{{ user.email }}</td>
                <td>{{ user.created_at }}</td>
                <td>{{ user.updated_at }}</td>
                <td>
                    <a href="/user/one_user/{{user.id}}">Show</a> |
                    <a href="/user/edit/{{user.id}}">Edit</a> |
                    <a href="/user/destroy/{{user.id}}">Delete</a>
                </td>
